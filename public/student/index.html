<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QAlive - Submit Anonymous Question</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <!-- Student View Header -->
  <header class="app-header">
    <a href="#" class="brand">
      <span class="brand-logo">QAlive</span>
      <span class="brand-badge">Student</span>
    </a>
    <span id="app-status" class="badge badge-success" role="status">Connected</span>
  </header>

  <!-- Main Mobile Content Area -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">Ask a Question</h1>
      <p class="card-subtitle">Submit your question anonymously. It will be reviewed by the moderator before appearing
        on the projector.</p>

      <!-- Feedback Area -->
      <div id="feedback-message" class="alert alert-info" aria-live="polite" style="display: none;"></div>

      <!-- Question Submission Form Panel -->
      <form id="question-form" onsubmit="return false;">
        <div class="form-group">
          <label for="question-input" class="form-label">Your Question</label>
          <textarea id="question-input" class="form-control"
            placeholder="Type your question here... (e.g., Can you explain the difference between local and public IP addresses?)"
            maxlength="300" required aria-describedby="char-count"></textarea>
          <div class="form-meta">
            <span>🔒 100% Anonymous</span>
            <span id="char-count">0 / 300 characters</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Submit Question
        </button>
      </form>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../js/app.js"></script>
</body>

</html>
